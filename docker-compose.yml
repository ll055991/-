services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: wall
      POSTGRES_DB: wall
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    # app 必须等数据库真正可连接后再启动迁移
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d wall"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://postgres:wall@db:5432/wall
      JWT_SECRET: ${JWT_SECRET:-change-me-to-a-long-random-string}
      # 可选：留空则使用本地词典情绪引擎
      LLM_API_KEY: ${LLM_API_KEY:-}
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:

